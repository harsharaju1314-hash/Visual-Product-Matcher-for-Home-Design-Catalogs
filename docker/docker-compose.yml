version: '3.8'

services:
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: cyncly_pgvector_db
    restart: always
    environment:
      POSTGRES_DB: product_catalog_db
      POSTGRES_USER: cyncly_user
      POSTGRES_PASSWORD: cyncly_password
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyncly_user -d product_catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
